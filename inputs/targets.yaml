          deleted_residues: 24
          construct_tags: []
          verdict: "clean truncation of the canonical sequence"
        rationale: >-
          A clean 575-residue truncation of P23219 (599 aa) - the signal peptide removed. This
          arm is human; the PDB arm is not. The head-to-head comparison of the two is therefore
