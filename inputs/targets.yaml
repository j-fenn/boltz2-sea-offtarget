# Per-target modelling configuration for the Boltz-2 inputs.
#
# This file replaces ten near-identical generator scripts, each of which carried one
# hard-coded sequence and one hard-coded template. Every decision that used to be
# implicit in *which copy of the script ran* is written down here, including the ones
# that turned out to be mistakes. `python inputs/generate_inputs.py` reproduces all
# 158 committed inputs byte for byte from this file plus the drug table.
#
# Fields per arm:
#   pdb_id            RCSB entry the sequence was taken from (null for the UniProt arm)
#   source            rcsb | hand_trimmed | uniprot_canonical
#   accession         reviewed UniProt accession the arm is *named* for
#   oligomeric_state  monomer | homodimer  -- what was actually modelled
#   chain_ids         protein chain ids, exactly as written in the committed files
#   strip_tags        false everywhere: this reproduces the inputs as run, tags included
#   audit             measured against the canonical sequence, not asserted
#   rationale         why this sequence, and what is wrong with it

schema_version: 1

drug_table:
  path: data/boltz_outputs/alltargetSHOICHET.xlsx
  sheet: Sheet1
  name_column: Drug_Name
  smiles_column: Drug SMILES
  target_column: Target

# Filename-safe substitution applied to drug names, preserved from the original
# generators so that regenerated filenames match the committed ones.
filename_sanitise_pattern: '[\\/*?:"<>| ()]'

targets:
  ADRA1A:
    accession: P35348
    canonical_length: 466
    arms:
      pdb:
        pdb_id: "8HN1"
        source: rcsb
        oligomeric_state: homodimer
        chain_ids: ['A_8HN1', 'B_8HN1']
        quote_chain_ids: true
        header_comment: "# Source PDB: 8HN1"
        output_dir: 8HN1_ADRA1A_yamls
        filename_pattern: 'ADRA1A_8HN1_{drug}.yaml'
        strip_tags: false
        n_inputs: 13
        audit:
          length: 346
          identity_to_canonical: 0.928
          substitutions: 8
          inserted_residues: 13
          deleted_residues: 127
          construct_tags: [FLAG, His-tag]
          verdict: "engineered construct: purification scaffold and point substitutions"
        rationale: >-
          PDB 8HN1, a GPCR crystallography construct: N-terminal FLAG (DYKDDDDA), C-terminal
          His8, three glycosylation sequons mutated (N7Q, N13Q, N22Q), two thermostabilising
          substitutions in TM3 (S113R, M115W), ICL3 residues 214-258 deleted and a BRIL-fusion
          remnant (DRNLR) left in its place. It is not the human protein.
        sequence: ""
      uniprot:
        pdb_id: null
        source: hand_trimmed
        oligomeric_state: homodimer
        chain_ids: ['A', 'B']
        quote_chain_ids: false
        header_comment: null
        output_dir: yaml_AAandsmileADRA1A
        filename_pattern: 'ADRA1A_{drug}.yaml'
        strip_tags: false
        n_inputs: 13
        audit:
          length: 348
          identity_to_canonical: 0.704
          substitutions: 14
          inserted_residues: 42
          deleted_residues: 190
          construct_tags: []
          verdict: "construct with 14 point substitutions vs canonical"
        rationale: >-
          Hand-pasted in the generator as '# Clean ADRA1A Sequence (Residues ~20-370)'. Only
          70.4% of it aligns to the reviewed P35348 record this project's own FASTA supplies; 42
          residues, including a 19-residue ICL3 block (DGRSGHGLRSASSRLMSSQ), appear nowhere in
          it. Whatever this sequence is - a paralog, an isoform, a merged paste - it is not the
          UniProt sequence the arm is named for.
        sequence: ""
  AR:
