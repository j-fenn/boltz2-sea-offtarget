        strip_tags: false
        n_inputs: 10
        audit:
          length: 553
          identity_to_canonical: 0.939
          substitutions: 33
          inserted_residues: 0
          deleted_residues: 46
          construct_tags: []
          verdict: "construct with 33 point substitutions vs canonical"
        rationale: >-
          PDB 3KK6. 33 substitutions spread evenly across the whole chain (median spacing 10
          residues), no engineering signature and no tags. That dispersion is an ortholog
          signature, not a mutated human construct: 3KK6 is the ovine enzyme. The 'human PTGS1'
