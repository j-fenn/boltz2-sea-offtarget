          substitutions: 0
          inserted_residues: 0
          deleted_residues: 669
          construct_tags: []
          verdict: "clean truncation of the canonical sequence"
        rationale: >-
          PDB 1T5Z, androgen receptor ligand-binding domain. A clean 251-residue truncation of
          P10275 (920 aa): the LBD only, no DBD, no NTD. Modelled as a homodimer, which the AR
          LBD does not form in the canonical dimerisation mode.
        sequence: "CQPIFLNVLEAIEPGVVCAGHDNNQPDSFAALLSSLNELGERQLVHVVKWAKALPGFRNLHVDDQMAVIQYSWMGLMVFAMGWRSFTNVNSRMLYFAPDLVFNEYRMHKSRMYSQCVRMRHLSQEFGWLQITPQEFLCMKALLLFSIIPVDGLKNQKFFDELRMNYIKELDRIIACKRKNPTSCSRRFYQLTKLLDSVQPIARELHQFTFDLLIKSHMVSVDFPEMMAEIISVQVPKILSGKVKPIYFHTQ"
      uniprot:
        pdb_id: null
        source: hand_trimmed
        oligomeric_state: homodimer
        chain_ids: ['A', 'B']
        quote_chain_ids: false
        header_comment: null
        output_dir: yaml_AAandsmileAR
        filename_pattern: 'AR_{drug}.yaml'
        strip_tags: false
        n_inputs: 13
        audit:
          length: 371
          identity_to_canonical: 1.000
          substitutions: 0
          inserted_residues: 0
          deleted_residues: 549
          construct_tags: []
          verdict: "clean truncation of the canonical sequence"
        rationale: >-
          A 371-residue hand-trim of P10275, exact but longer than the PDB arm. The two arms
          therefore differ by 120 residues of the same protein, not by construct identity.
        sequence: ""
  MAOA:
    accession: P21397
    canonical_length: 527
